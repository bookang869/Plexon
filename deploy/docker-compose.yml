services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: plexon
      POSTGRES_USER: plexon
      POSTGRES_PASSWORD: plexon
    ports:
      - "5433:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexon -d plexon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-openai:
    build:
      context: ..
      dockerfile: mocks/Dockerfile.openai
    ports:
      - "8081:8080"

  mock-anthropic:
    build:
      context: ..
      dockerfile: mocks/Dockerfile.anthropic
    ports:
      - "8082:8080"

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317"
      - "3200:3200"

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PLEXON_DATABASE_URL: "postgresql://plexon:plexon@postgres:5432/plexon"
      PLEXON_CONFIG_PATH: "/app/config.yaml"
      PLEXON_REDIS_URL: "redis://redis:6379/0"
      PLEXON_OTEL_EXPORTER_ENDPOINT: "tempo:4317"
    depends_on:
      - postgres
      - redis
      - tempo

  setup:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PLEXON_DATABASE_URL: "postgresql://plexon:plexon@postgres:5432/plexon"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python3", "scripts/setup_demo_teams.py"]
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on:
      - prometheus
      - tempo
